name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 22:25 UTC is after the US close in both summer and winter.
    - cron: '25 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - name: Download completed daily prices and calculate RSI
        run: python scripts/update_data.py
      - name: Prepare static website
        run: |
          mkdir -p site/data
          cp index.html styles.css app.js site/
          cp data/stocks.json site/data/
      - name: Save market data for RSI notifications
        uses: actions/upload-artifact@v4
        with:
          name: rsi-market-data
          path: data/stocks.json
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download the published market snapshot
        uses: actions/download-artifact@v4
        with:
          name: rsi-market-data
          path: data
      - name: Publish new RSI signals as GitHub Issues
        run: python scripts/send_notifications.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}

